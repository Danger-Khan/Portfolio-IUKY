<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD Part Viewer</title>
    <style>
        :root {
            --bg: #0a0e14;
            --panel: rgba(15, 20, 28, 0.85);
            --line: rgba(148, 163, 184, 0.2);
            --accent: #38bdf8;
            --text: #e6edf3;
            --muted: rgba(230, 237, 243, 0.6);
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at 30% 20%, rgba(56, 189, 248, 0.08), transparent 45%), var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas { display: block; width: 100%; height: 100%; }
        #hud {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 18px;
        }
        .bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            pointer-events: auto;
        }
        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            padding: 10px 16px;
        }
        #back {
            text-decoration: none;
            color: var(--text);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        #title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            max-width: 60vw;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #hint {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.04em;
        }
        #status {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
            font-size: 13px;
            color: var(--muted);
            text-align: center;
            padding: 20px;
        }
        #status strong { color: var(--accent); }
        .hidden { display: none !important; }
        #dl {
            text-decoration: none;
            color: #06140f;
            background: var(--accent);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 10px 16px;
            border-radius: 999px;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div class="bar">
            <a id="back" class="panel" href="index.html">← CAD/CAM/CAE Portfolio</a>
            <div id="title" class="panel">Loading…</div>
        </div>
        <div class="bar">
            <div id="hint" class="panel">Drag to orbit · Scroll to zoom · Right-drag to pan</div>
            <a id="dl" href="#" download>Download File</a>
        </div>
    </div>

    <div id="status">
        <strong id="status-text">Loading model…</strong>
        <span id="status-sub">Large STL exports can take a moment on first load.</span>
    </div>

    <canvas id="c"></canvas>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { STLLoader } from 'three/addons/loaders/STLLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const params = new URLSearchParams(window.location.search);
        const modelPath = params.get('model');
        const titleText = params.get('title') || (modelPath ? modelPath.split('/').pop() : 'Untitled Part');

        document.getElementById('title').textContent = titleText;
        document.title = titleText + ' — CAD Viewer';

        const dlLink = document.getElementById('dl');
        const statusEl = document.getElementById('status');
        const statusText = document.getElementById('status-text');
        const statusSub = document.getElementById('status-sub');

        if (modelPath) {
            dlLink.href = modelPath;
        } else {
            dlLink.classList.add('hidden');
        }

        const canvas = document.getElementById('c');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 5000);
        camera.position.set(80, 80, 120);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;

        scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x0a0e14, 1.1));
        const key = new THREE.DirectionalLight(0xffffff, 1.4);
        key.position.set(120, 180, 100);
        scene.add(key);
        const rim = new THREE.DirectionalLight(0x38bdf8, 0.6);
        rim.position.set(-120, 60, -100);
        scene.add(rim);

        const grid = new THREE.GridHelper(400, 40, 0x2c3a4b, 0x1a2432);
        grid.position.y = -0.01;
        scene.add(grid);

        function frameObject(object) {
            const box = new THREE.Box3().setFromObject(object);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());

            object.position.x -= center.x;
            object.position.y -= box.min.y;
            object.position.z -= center.z;

            const maxDim = Math.max(size.x, size.y, size.z) || 1;
            const distance = maxDim * 2.2;
            camera.position.set(distance * 0.7, distance * 0.6, distance * 0.9);
            camera.near = maxDim / 100;
            camera.far = maxDim * 50;
            camera.updateProjectionMatrix();
            controls.target.set(0, size.y / 2, 0);
            controls.update();
        }

        if (!modelPath) {
            statusText.textContent = 'No model specified.';
            statusSub.textContent = 'Open this viewer from a project card in the CAD/CAM/CAE portfolio.';
        } else {
            const loader = new STLLoader();
            loader.load(
                modelPath,
                (geometry) => {
                    geometry.computeVertexNormals();
                    const material = new THREE.MeshStandardMaterial({
                        color: 0x9fb4c7,
                        metalness: 0.25,
                        roughness: 0.45
                    });
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.rotation.x = -Math.PI / 2;
                    scene.add(mesh);
                    frameObject(mesh);
                    statusEl.classList.add('hidden');
                },
                (xhr) => {
                    if (xhr.lengthComputable) {
                        const pct = Math.round((xhr.loaded / xhr.total) * 100);
                        statusText.textContent = `Loading model… ${pct}%`;
                    }
                },
                (error) => {
                    console.error('Failed to load STL:', error);
                    statusText.textContent = 'Could not load this model.';
                    statusSub.textContent = 'The file may be missing or the browser blocked a local file request — try the download link instead.';
                }
            );
        }

        function animate() {
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
